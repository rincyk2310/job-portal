<!DOCTYPE html>
<html lang="en">
{% load static %}

<head>
    <meta charset="UTF-8">
    <title>{% block title %}Job Portal{% endblock %}</title>
</head>
<body>

    {% include 'navigation.html' %}


    <marquee style="font-family:'Monotype Corsiva' ; font-size:25px; color:darkcyan; background-color:black; font-weight: bold; margin-top:1%">
        User Login
    </marquee>
    <hr>

    <form class="container mt-5" method="post">
        {% csrf_token %}
        <label><b>Email Address</b></label>
        <input type="email" class="form-control" name="uname" placeholder="Enter your emailid">
        <label><b>Password</b></label>
        <input type="password" class="form-control" name="pwd" placeholder="Enter Password">

        <input type="submit" value="Login" class="btn btn-primary" style="margin-top:2%;  height:40px; font-size:20px; width:200px;" >

        <a href="{% url 'user_signup' %}" class="btn btn-success" style="margin-top:2%;  height:40px; font-size:20px; width:300px;" >CREATE AN ACCOUNT</a>
    </form>

<br><br>

     {%block content %}
      {% include 'footer.html' %}

    {% if error == "no" %}
<script>
    alert("Login successful");
    window.location.href = "{% url 'user_home' %}";
</script>
{% endif %}

{% if error == "yes" %}
<script>
    alert("Invalid login credentials , try again...");
</script>
{% endif %}
     {% endblock %}

</body>
</html>
