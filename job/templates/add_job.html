<!DOCTYPE html>
<html lang="en">
{% load static %}

<head>
    <meta charset="UTF-8">
    <title>{% block title %}Job Portal{% endblock %}</title>
</head>
<body>

    {% include 'recruiter_navigation.html' %}


<marquee style="font-family:'Monotype Corsiva'; font-size:25px; color:darkcyan;
background-color:black; font-weight:bold; margin-top:1%">
   Add Job Details
</marquee>

<hr>

<form class="container mt-5"
      name="signup"
      method="post"
      enctype="multipart/form-data"
      onsubmit="return checkpass();">

    {% csrf_token %}

    <div class="form-row">
        <div class="form-group col-md-12">
            <label><b>Job Title</b></label>
            <input type="text" class="form-control" name="title" placeholder="Enter Job Title" required>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group col-md-6">
            <label><b>Start Date</b></label>
            <input type="date" class="form-control" name="startdate"  required>
        </div>
        <div class="form-group col-md-6">
            <label><b>End Date</b></label>
            <input type="date" class="form-control" name="enddate"  required>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group col-md-6">
            <label><b>Salary(per month)</b></label>
            <input type="text" class="form-control" name="salary"  required>
        </div>
        <div class="form-group col-md-6">
            <label><b> Company Logo</b></label>
            <input type="file" class="form-control" name="image"  required>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group col-md-6">
            <label><b>Experience(In Years)</b></label>
            <input type="text" class="form-control" name="experience"  required>
        </div>
        <div class="form-group col-md-6">
            <label><b>Location</b></label>
            <input type="text" class="form-control" name="location"  required>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group col-md-12">
            <label><b>Skills</b></label>
            <input type="text" class="form-control" name="skills"  required>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group col-md-12">
            <label><b>Description</b></label>
            <textarea class="form-control" name="description"  required></textarea>
        </div>
    </div>




    <input type="submit"
           value="Submit"
           class="btn btn-primary"
           style="height:40px; font-size:20px; width:200px;">
</form>

<br><br>

{% include 'footer.html' %}

{% if error == "no" %}
<script>
    alert("Job details has been added");
    window.location.href = "{% url 'job_list' %}";
</script>
{% endif %}

{% if error == "yes" %}
<script>
    alert("Something went wrong, try again...");
</script>
{% endif %}



</body>
</html>





     {%block content %}


     {% endblock %}

</body>
</html>
