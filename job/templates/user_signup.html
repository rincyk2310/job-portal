<!DOCTYPE html>
<html lang="en">
{% load static %}

<head>
    <meta charset="UTF-8">
    <title>Job Portal</title>
</head>
<style>

/* Background */
body{
    background: linear-gradient(135deg, #74ebd5, #9face6);
    font-family: Arial, sans-serif;
}

/* Center container */
.signup-container{
    display: flex;
    justify-content: center;

    height: 100vh;
    align-items: flex-start;
}

/* Form Box */
.signup-box{
    width: 520px;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    animation: slideIn 0.8s ease;
     margin-top: 100px;

}

/* Animation from left */
@keyframes slideIn{
    from{
        opacity: 0;
        transform: translateX(-200px);
    }
    to{
        opacity: 1;
        transform: translateX(0);
    }
}

/* Inputs */
.form-control{
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 10px;
}

.btn-success{
    background-color:#14532d;    /* parrot green */
    border: none;
    width: 100%;
    height: 45px;
    font-size: 18px;
    border-radius: 8px;
    transition: 0.3s;
}

.btn-success:hover{
    background-color: #3cb371;   /* slightly darker on hover */
    transform: scale(1.05);
}





    .popup-box{
    position: fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);

    width:400px;
    padding:25px;

    background:white;

    border-radius:15px;

    box-shadow:0 12px 40px rgba(0,0,0,0.25);

    text-align:center;
    font-size:18px;

    z-index:99999;

    animation: fadePopup 0.4s ease;
}

.success{
    border-left:6px solid #28a745;
}

.error{
    border-left:6px solid #dc3545;
}

@keyframes fadePopup{
    from{
        opacity:0;
        transform:translate(-50%,-40%);
    }
    to{
        opacity:1;
        transform:translate(-50%,-50%);
    }
}



.marquee {
    width: 100%;
    overflow: hidden;
    background-color: black;
    margin-top: 1%;
}

.marquee span {
    display: inline-block;
    white-space: nowrap;
    color: darkcyan;
    font-family: 'Monotype Corsiva';
    font-size: 25px;
    font-weight: bold;
    padding: 10px 0;
    animation: marqueeMove 6s linear infinite;
}

@keyframes marqueeMove {
    from {
        transform: translateX(100%);
    }
    to {
        transform: translateX(-100%);
    }
}
</style>
<body>

{% include 'navigation.html' %}

<!-- ✅ PASSWORD CHECK SCRIPT -->
<script>
    function checkpass() {
        var pwd = document.getElementById("pwd").value;
        var cpwd = document.getElementById("cpwd").value;

        if (pwd !== cpwd) {
            alert("Password and Confirm Password do not match");
            document.getElementById("cpwd").focus();
            return false;   // stop form submit
        }
        return true;        // allow submit
    }
</script>

<div class="marquee">
    <span>User SignUp</span>
</div>

<hr>

<div class="signup-container">
    <div class="signup-box">

        <h2 style="text-align:center; margin-bottom:20px;">Create Account</h2>

        <form name="signup" method="post" enctype="multipart/form-data" onsubmit="return checkpass();">
            {% csrf_token %}

            <div class="form-row">
                <div class="form-group col-md-6">
                    <input type="text" class="form-control" name="fname" placeholder="First Name" required>
                </div>
                <div class="form-group col-md-6">
                    <input type="text" class="form-control" name="lname" placeholder="Last Name" required>
                </div>
            </div>

            <input type="text" class="form-control" name="contact" placeholder="Contact Number" required>
            <input type="email" class="form-control" name="email" placeholder="Email Address" required>

            <div class="form-row">
                <div class="form-group col-md-6">
                    <input type="password" class="form-control" id="pwd" name="pwd" placeholder="Password" required>
                </div>
                <div class="form-group col-md-6">
                    <input type="password" class="form-control" id="cpwd" name="cpwd" placeholder="Confirm Password" required>
                </div>
            </div>

            <div class="form-row" style="margin-bottom:10px;">
                <div class="form-group col-md-6">
                    <label>Gender:</label><br>
                    <input type="radio" name="gender" value="male" required> Male
                    <input type="radio" name="gender" value="female"> Female
                </div>

                <div class="form-group col-md-6">
                    <input type="file" class="form-control" name="image" required>
                </div>
            </div>

            <input type="submit" value="Sign Up" class="btn btn-success">
        </form>

    </div>
</div>
