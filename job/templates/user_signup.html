<!DOCTYPE html>
<html lang="en">
{% load static %}

<head>
    <meta charset="UTF-8">
    <title>Job Portal</title>
</head>
<style>
    .popup-box{
    position: fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);

    width:400px;
    padding:25px;

    background:white;

    border-radius:15px;

    box-shadow:0 12px 40px rgba(0,0,0,0.25);

    text-align:center;
    font-size:18px;

    z-index:99999;

    animation: fadePopup 0.4s ease;
}

.success{
    border-left:6px solid #28a745;
}

.error{
    border-left:6px solid #dc3545;
}

@keyframes fadePopup{
    from{
        opacity:0;
        transform:translate(-50%,-40%);
    }
    to{
        opacity:1;
        transform:translate(-50%,-50%);
    }
}
</style>
<body>

{% include 'navigation.html' %}

<!-- ✅ PASSWORD CHECK SCRIPT -->
<script>
    function checkpass() {
        var pwd = document.getElementById("pwd").value;
        var cpwd = document.getElementById("cpwd").value;

        if (pwd !== cpwd) {
            alert("Password and Confirm Password do not match");
            document.getElementById("cpwd").focus();
            return false;   // stop form submit
        }
        return true;        // allow submit
    }
</script>

<marquee style="font-family:'Monotype Corsiva'; font-size:25px; color:darkcyan;
background-color:black; font-weight:bold; margin-top:1%">
    User SignUp
</marquee>

<hr>

<form class="container mt-5"
      name="signup"
      method="post"
      enctype="multipart/form-data"
      onsubmit="return checkpass();">

    {% csrf_token %}

    <div class="form-row">
        <div class="form-group col-md-6">
            <label><b>First Name</b></label>
            <input type="text" class="form-control" name="fname"
                   placeholder="Enter First Name" required>
        </div>

        <div class="form-group col-md-6">
            <label><b>Last Name</b></label>
            <input type="text" class="form-control" name="lname"
                   placeholder="Enter Last Name" required>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group col-md-12">
            <label><b>Contact Number</b></label>
            <input type="text" class="form-control" name="contact"
                   placeholder="Enter Contact Number" required>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group col-md-12">
            <label><b>Email Address</b></label>
            <input type="email" class="form-control" name="email"
                   placeholder="Enter Email Address" required>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group col-md-6">
            <label><b>Password</b></label>
            <input type="password" class="form-control"
                   id="pwd" name="pwd"
                   placeholder="Enter Password" required>
        </div>

        <div class="form-group col-md-6">
            <label><b>Confirm Password</b></label>
            <input type="password" class="form-control"
                   id="cpwd" name="cpwd"
                   placeholder="Enter Confirm Password" required>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group col-md-6">
            <label><b>Gender</b></label><br>
            <input type="radio" name="gender" value="male" required> Male
            <input type="radio" name="gender" value="female"> Female
        </div>

        <div class="form-group col-md-6">
            <label><b>Image</b></label>
            <input type="file" class="form-control" name="image" required>
        </div>
    </div>

    <input type="submit"
           value="Submit"
           class="btn btn-primary"
           style="height:40px; font-size:20px; width:200px;">
</form>

<br><br>

{% include 'footer.html' %}

{% if error == "no" %}
<div class="popup-box success">
✅ Signup successful
</div>

<script>
setTimeout(function(){
    window.location.href="{% url 'user_login' %}";
},2000);
</script>
{% endif %}


{% if error == "yes" %}
<div class="popup-box error">
❌ Something went wrong, try again...
</div>
{% endif %}


</body>
</html>
