<!DOCTYPE html>
<html lang="en">
{% load static %}

<head>
    <meta charset="UTF-8">
    <title>{% block title %}Job Portal{% endblock %}</title>
</head>
<body>

    {% include 'navigation.html' %}


<div class="container-fluid mt-3">
    <img src="{% static 'images/port3.jpg' %}" style="height:450px;width:100%;">
</div>

<div class="placed-section">
    <div class="container">

        <h1 class="placed-title">
            ———— | OUR PLACED STUDENTS | ————
        </h1>

        <div class="row justify-content-center">

            <div class="col-md-3 student-card">
                <img src="{% static 'images/f.jpg' %}">
                <div class="company-name">Amazon</div>
            </div>

            <div class="col-md-3 student-card">
                <img src="{% static 'images/f7.jpg' %}">
                <div class="company-name">Facebook</div>
            </div>

            <div class="col-md-3 student-card">
                <img src="{% static 'images/f1.jpg' %}">
                <div class="company-name">Google</div>
            </div>

            <div class="col-md-3 student-card">
                <img src="{% static 'images/f3.png' %}">
                <div class="company-name">Oracle</div>
            </div>

            <div class="col-md-3 student-card">
                <img src="{% static 'images/f5.png' %}">
                <div class="company-name">Capgemini</div>
            </div>

            <div class="col-md-3 student-card">
                <img src="{% static 'images/f4.png' %}">
                <div class="company-name">EY</div>
            </div>

            <div class="col-md-3 student-card">
                <img src="{% static 'images/f6.jpg' %}">
                <div class="company-name">Infosys</div>
            </div>

            <div class="col-md-3 student-card">
                <img src="{% static 'images/f2.jpg' %}">
                <div class="company-name">TCS</div>
            </div>

        </div>
    </div>
</div>

    {% include 'footer.html' %}


</body>
</html>

<style>
    .placed-section {
        background: #90caf9;
        padding: 40px 0;
        margin-top: 30px;
    }

    .placed-title {
        color: #fff;
        text-align: center;
        font-weight: 600;
        margin-bottom: 30px;
        letter-spacing: 1px;
    }

    .student-card {
        position: relative;
        text-align: center;
        margin-bottom: 30px;
        transition: transform 0.3s ease;
    }

    .student-card:hover {
        transform: translateY(-10px);
    }

    .student-card img {
        width: 180px;
        height: 180px;
        border-radius: 50%;
        object-fit: cover;
        border: 4px solid #fff;
    }

    .company-name {
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.7);
        color:white;
        padding: 5px 15px;
        border-radius: 20px;
        font-size: 14px;
        opacity: 1;
        transition: opacity 0.3s ease;
    }

    .student-card:hover .company-name {
        opacity: 1;
    }
</style>
