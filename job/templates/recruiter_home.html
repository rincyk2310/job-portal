<!DOCTYPE html>
<html lang="en">
{% load static %}

<head>
    <meta charset="UTF-8">
    <title>{% block title %}Job Portal{% endblock %}</title>
</head>
<body>

    {% include 'recruiter_navigation.html' %}



<marquee style="font-family:'Monotype Corsiva'; font-size:25px; color:darkcyan;
background-color:black; font-weight:bold; margin-top:1%">
    Profile
</marquee>

<hr>
<div class="container">
    <div class="row">
        <div class="col-sm-6">


<form class="mt-5"
      name="signup"
      method="post"
      enctype="multipart/form-data"
      onsubmit="return checkpass();">

    {% csrf_token %}

    <div class="form-row">
        <div class="form-group col-md-6">
            <label><b>First Name</b></label>
            <input type="text" class="form-control" name="fname"
                   value="{{recruiter.user.first_name}}" required>
        </div>

        <div class="form-group col-md-6">
            <label><b>Last Name</b></label>
            <input type="text" class="form-control" name="lname"
                  value="{{recruiter.user.last_name}}" required>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group col-md-6">
            <label><b>Contact Number</b></label>
            <input type="text" class="form-control" name="contact"
                   value="{{recruiter.mobile}}" required>
        </div>
        <div class="form-group col-md-6">
            <label><b>Company</b></label>
            <input type="text" class="form-control" name="company"
                   value="{{recruiter.company}}"  readonly required>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group col-md-12">
            <label><b>Email Address</b></label>
            <input type="email" class="form-control" name="email"
                   value="{{recruiter.user.username}}" readonly required>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group col-md-6">
            <label><b>Gender</b></label>
            <div style="border:1px solid lightgrey; padding:6px; border-radius:6px">
                <div class="custom-control custom-radio custom-control-inline">
                <input type="radio" id="genderMale" name="gender" class="custom-control-input" value="male"
                   {% if recruiter.gender == "male" %}checked{% endif %}>
                <label class="custom-control-label" for="genderMale">Male</label>
                </div>

        <div class="custom-control custom-radio custom-control-inline">
            <input type="radio" id="genderFemale" name="gender" class="custom-control-input" value="female"
                   {% if recruiter.gender == "female" %}checked{% endif %}>
            <label class="custom-control-label" for="genderFemale">Female</label>
        </div>

    </div>
</div>



        <div class="form-group col-md-6">
            <label><b>Image</b></label>
            <input type="file" class="form-control" name="image" >
        </div>
    </div>


    <input type="submit"
           value="Submit"
           class="btn btn-primary"
           style="height:40px; font-size:20px; width:200px;">
</form>
    </div>
        <div class="col-sm-4 mt-5 text-center">
            <img src="{{recruiter.image.url}}" width="200px" height="200px">
        </div>
         </div>
    </div>

<br><br>

{% include 'footer.html' %}

{% if error == "no" %}
<script>
    alert("Profile updated successfully");
    window.location.href = "{% url 'recruiter_home' %}";
</script>
{% endif %}

{% if error == "yes" %}
<script>
    alert("Something went wrong, try again...");
</script>
{% endif %}

{%block content %}


     {% endblock %}

</body>
</html>
