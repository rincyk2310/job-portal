<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <title>Job Portal</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

 <style>


.navbar{
    background:#000000 !important;
}

/* Navbar text white */
.navbar a{
    color:white !important;
    font-weight:500;
}

/* Navbar brand logo */
.navbar-brand{
    color:white !important;
}

/* Navbar hover effect */
.navbar a:hover{
    color:#90caf9 !important;
}
    </style>
<body>
<div class="container">
    <div class="row">


    </div>

</div>
<nav class="navbar navbar-expand-sm" >
    <a class="navbar-brand text-white pl-5 font-weight-bold" style="font-family:'Monotype Corsiva';font-size:30px;">Job Portal</a>
    <ul class="navbar-nav">
        <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'recruiter_home' %}active{% endif %}"
                href="{% url 'recruiter_home' %}" style="margin-left:280px;">
                <i class="fa fa-home mr-1"></i>Home
            </a>
        </li>

        <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'add_job' %}active{% endif %}"
                href="{% url 'add_job' %}">
                <i class="fa fa-plus-circle mr-1"></i>Add Job
            </a>
        </li>

        <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'job_list' %}active{% endif %}"
            href="{% url 'job_list' %}">
            <i class="fa fa-list-ol mr-1"></i>Job List
            </a>
        </li>

        <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'applied_candidates' %}active{% endif %}"
            href="{% url 'applied_candidates' %}">
            <i class="fa fa-list-ol mr-1"></i>Candidate Applied
            </a>
        </li>

<li class="nav-item">
<a class="nav-link {% if request.resolver_match.url_name == 'change_pwdrecruiter' %}active{% endif %}"
href="{% url 'change_pwdrecruiter' %}">
<i class="fa fa-user-circle mr-1"></i>Change Password
</a>
</li>

<li class="nav-item">
<a class="nav-link {% if request.resolver_match.url_name == 'Logout' %}active{% endif %}"
href="{% url 'Logout' %}">
<i class="fa fa-sign-out mr-1"></i>Logout
</a>
</li>

    </ul>
        <a class="navbar-brand text-white pl-5 font-weight-bold" style="font-family:'Monotype Corsiva';font-size:30px;">{{request.user.first_name}} {{request.user.last_name}}</a>


</nav>

</body>
</html>


<style>
:root {
    --sky-blue: #2c7be5;
    --sky-blue-dark: #1b5fc1;
    --text-light: #ffffff;
}


.navbar{
    background:#000000 !important;
}

/* Navbar text white */
.navbar a{
    color:white !important;
    font-weight:500;
}

/* Navbar brand logo */
.navbar-brand{
    color:white !important;
}

/* Navbar hover effect */
.navbar a:hover{
    color:#90caf9 !important;
}
/* Icons */
.fa {
    transition: transform 0.3s ease;
}

.fa:hover {
    transform: scale(1.2);
}

    .navbar .active{
    font-weight:bold;
    border-bottom:2px solid white;
    color:white !important;
}
</style>
