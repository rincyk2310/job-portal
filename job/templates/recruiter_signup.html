<!DOCTYPE html>
<html lang="en">
{% load static %}

<head>
    <meta charset="UTF-8">
    <title>Job Portal</title>
</head>

<body>

{% include 'navigation.html' %}

<!-- ✅ PASSWORD CHECK SCRIPT -->
<script>
    function checkpass() {
        var pwd = document.getElementById("pwd").value;
        var cpwd = document.getElementById("cpwd").value;

        if (pwd !== cpwd) {
            alert("Password and Confirm Password do not match");
            document.getElementById("cpwd").focus();
            return false;   // stop form submit
        }
        return true;        // allow submit
    }
</script>

<marquee style="font-family:'Monotype Corsiva'; font-size:25px; color:darkcyan;
background-color:black; font-weight:bold; margin-top:1%">
    Recruiter SignUp
</marquee>

<hr>

<form class="container mt-5"
      name="signup"
      method="post"
      enctype="multipart/form-data"
      onsubmit="return checkpass();">

    {% csrf_token %}

    <div class="form-row">
        <div class="form-group col-md-6">
            <label><b>First Name</b></label>
            <input type="text" class="form-control" name="fname"
                   placeholder="Enter First Name" required>
        </div>

        <div class="form-group col-md-6">
            <label><b>Last Name</b></label>
            <input type="text" class="form-control" name="lname"
                   placeholder="Enter Last Name" required>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group col-md-6">
            <label><b>Contact Number</b></label>
            <input type="text" class="form-control" name="contact"
                   placeholder="Enter Contact Number" required>
        </div>
        <div class="form-group col-md-6">
            <label><b>Company</b></label>
            <input type="text" class="form-control" name="company"
                   placeholder="Enter Your Company" required>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group col-md-12">
            <label><b>Email Address</b></label>
            <input type="email" class="form-control" name="email"
                   placeholder="Enter Email Address" required>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group col-md-6">
            <label><b>Password</b></label>
            <input type="password" class="form-control"
                   id="pwd" name="pwd"
                   placeholder="Enter Password" required>
        </div>

        <div class="form-group col-md-6">
            <label><b>Confirm Password</b></label>
            <input type="password" class="form-control"
                   id="cpwd" name="cpwd"
                   placeholder="Enter Confirm Password" required>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group col-md-6">
            <label><b>Gender</b></label><br>
            <input type="radio" name="gender" value="male" required> Male
            <input type="radio" name="gender" value="female"> Female
        </div>

        <div class="form-group col-md-6">
            <label><b>Image</b></label>
            <input type="file" class="form-control" name="image" required>
        </div>
    </div>

    <input type="submit"
           value="Submit"
           class="btn btn-primary"
           style="height:40px; font-size:20px; width:200px;">
</form>

<br><br>

{% include 'footer.html' %}

{% if error == "no" %}
<script>
    alert("Signup successful");
    window.location.href = "{% url 'recruiter_login' %}";
</script>
{% endif %}

{% if error == "yes" %}
<script>
    alert("Something went wrong, try again...");
</script>
{% endif %}



</body>
</html>
