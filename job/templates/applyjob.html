<!DOCTYPE html>
<html lang="en">
{% load static %}

<head>
    <meta charset="UTF-8">
    <title>{% block title %}Job Portal{% endblock %}</title>
</head>
<body>

    {% include 'user_navigation.html' %}

    <marquee style="font-family:'Monotype Corsiva' ; font-size:25px; color:darkcyan; background-color:black; font-weight: bold; margin-top:1%">
         Apply For  Job
    </marquee>
    <hr>

   <div class="container shadow-lg py-2 mb-2">
       <form method="post" enctype="multipart/form-data">
           {% csrf_token %}
           <div class="form-row">
               <label class="font-weight-bold">Upload Resume</label>
               <input type="file" class="form-control" name="resume" >
           </div>
           <input type="submit" value="submit" class="btn btn-danger mt-3" style="width:100px;">

       </form>
   </div>




     {%block content %}

    {% if error == "close" %}
<script>
    alert("Application line are closed , last date is over");
    window.location.href = "{% url 'user_latestjob' %}";
</script>
{% endif %}

    {% if error == "notopen" %}
<script>
    alert("Application line is not open");
    window.location.href = "{% url 'user_latestjob' %}";
</script>
{% endif %}

{% if error == "done" %}
<script>
    alert("Job Application submitted successfully ");
     window.location.href = "{% url 'user_latestjob' %}";
</script>
{% endif %}
     {% endblock %}

</body>
</html>
