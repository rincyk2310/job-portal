<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <title>Job Portal</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

</head>
<body>
<div class="container">
    <div class="row">

    </div>

</div>
<nav class="navbar navbar-expand-sm" style="background-color:maroon">
    <a class="navbar-brand text-white pl-5 font-weight-bold" style="font-family:'Monotype Corsiva';font-size:30px;">Job Portal</a>
    <ul class="navbar-nav">
        <li class="nav-item">
            <a class="nav-link" href="{% url 'user_home' %}" style="margin-left:280px;"><i class="fa fa-home mr-1"></i>Home</a>

        </li>

            <a class="nav-link" href="{% url 'change_pwduser' %}" > <i class="fa fa-user-circle mr-1"></i>Change password</a>
        </li>

            <a class="nav-link" href="{% url 'Logout' %}" ><i class="fa fa-sign-out mr-1"></i>Logout</a>
        </li>

    </ul>
    <a class="navbar-brand text-white pl-5 font-weight-bold " style="font-family:'Monotype Corsiva';font-size:30px;">{{request.user.first_name}} {{request.user.last_name}}</a>


</nav>

<style>


.navbar{
    background:#000000 !important;
}

/* Navbar text white */
.navbar a{
    color:white !important;
    font-weight:500;
}

/* Navbar brand logo */
.navbar-brand{
    color:white !important;
}

/* Navbar hover effect */
.navbar a:hover{
    color:#90caf9 !important;
}
:root {
    --sky-blue: #2c7be5;
    --sky-blue-dark: #1b5fc1;
    --text-light: #ffffff;
}

/* Icons */
.fa {
    transition: transform 0.3s ease;
}

.fa:hover {
    transform: scale(1.2);
}
</style>
