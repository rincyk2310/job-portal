{% include 'admin_navigation.html' %}

<div class="container mt-5">

<h3 class="text-center mb-4">User Messages</h3>

<table class="table table-bordered table-striped">

<tr>
<th>Name</th>
<th>Email</th>
<th>Message</th>
</tr>

{% for i in messages %}
<tr>
<td>{{ i.name }}</td>
<td>{{ i.email }}</td>
<td>{{ i.message }}</td>
</tr>
{% endfor %}

</table>

</div>


<style>

body{
background:#f4f6f9;
}

.card{
border-radius:10px;
}

.table{
font-size:15px;
}

.table td{
vertical-align:middle;
}

</style>
